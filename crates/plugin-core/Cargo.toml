[package]
name = "plugin-core"
version = "0.1.0"
edition = "2024"
authors = ["Akash Chakraborty <akashchakrabortymsc@gmail.com>"]
repository = "https://github.com/akashchakrabortymsc-cmd/crankshaft_plugin"
description = "Shared types and contracts for the Crankshaft plugin system"
license = "MIT OR Apache-2.0"

[dependencies]
crankshaft-engine = { git = "https://github.com/stjude-rust-labs/crankshaft" }
nonempty = { version = "0.12", features = ["serialize"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }