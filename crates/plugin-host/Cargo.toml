[package]
name = "plugin-host"
version = "0.1.0"
edition = "2024"
authors = ["Akash Chakraborty <akashchakrabortymsc@gmail.com>"]
repository = "https://github.com/akashchakrabortymsc-cmd/crankshaft_plugin"
description = "Engine-side crate that spawns plugin processes and adapts them to Crankshaft's Backend trait"
license = "MIT OR Apache-2.0"

[dependencies]
plugin-core = { path = "../plugin-core" }
plugin-protocol = { path = "../plugin-protocol" }
crankshaft-engine = { git = "https://github.com/stjude-rust-labs/crankshaft" }

anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
nonempty = { version = "0.12", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }